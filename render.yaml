services:
  - type: web
    name: lineflow-shift-rotation
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: lineflow-database
          property: connectionString
      - key: APP_PASSWORD
        sync: false

databases:
  - name: lineflow-database
    plan: free
    region: frankfurt
    databaseName: lineflow
    user: lineflow

